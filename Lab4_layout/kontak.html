<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <header>
            <h1>Layout Sederhana</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="#">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>

        <!-- Tugas 2: layout form isian nama, email, message -->
        <section class="page">
            <h1>Hubungi Kami</h1>
            <p>Silakan isi formulir di bawah ini untuk mengirimkan pesan.</p>

            <form>
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Nama lengkap" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Tulis pesan Anda..." required></textarea>
                </div>
                <button type="submit" class="btn btn-large">Kirim Pesan</button>
            </form>
        </section>

        <footer>
            <p>&copy; 2026 - Universitas Pelita Bangsa</p>
        </footer>

    </div>
</body>
</html>
